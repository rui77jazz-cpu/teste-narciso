<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Teste Narciso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h1 {
            color: #1F4E78;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .stat-card p {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters label {
            font-weight: bold;
            color: #2E5090;
        }

        .filters select,
        .filters input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
        }

        .filters button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s;
        }

        .filters button:hover {
            transform: translateY(-2px);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .results-table th,
        .results-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        .results-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .results-table tr:hover {
            background: #f5f5f5;
        }

        .score-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .score-excellent {
            background: #4caf50;
            color: white;
        }

        .score-good {
            background: #8bc34a;
            color: white;
        }

        .score-fair {
            background: #ff9800;
            color: white;
        }

        .score-poor {
            background: #f44336;
            color: white;
        }

        .btn-view {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            transition: background 0.3s;
        }

        .btn-view:hover {
            background: #5568d3;
        }

        .btn-export {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1em;
            margin: 10px 5px;
            transition: transform 0.3s;
        }

        .btn-export:hover {
            transform: translateY(-2px);
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            animation: fadeIn 0.3s;
        }

        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 1100px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            animation: slideIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .close {
            color: #999;
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
            line-height: 20px;
        }

        .close:hover {
            color: #333;
        }

        .modal h2 {
            color: #1F4E78;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .detail-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .detail-section h3 {
            color: #2E5090;
            margin-bottom: 15px;
        }

        .answer-item {
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .answer-item strong {
            color: #2E5090;
            display: block;
            margin-bottom: 8px;
        }

        .answer-item p {
            color: #333;
            line-height: 1.6;
        }

        /* Sistema de Correção */
        .correction-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
        }

        .correction-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .correction-controls label {
            font-weight: bold;
            color: #856404;
        }

        .correction-controls input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 2px solid #ffc107;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
        }

        .correction-controls textarea {
            flex: 1;
            min-width: 300px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            resize: vertical;
            min-height: 60px;
        }

        .btn-save-correction {
            background: #4caf50;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin: 30px auto;
            display: block;
            transition: all 0.3s;
        }

        .btn-save-correction:hover {
            background: #45a049;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .total-points {
            background: #e8f5e9;
            border: 3px solid #4caf50;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
        }

        .total-points h3 {
            color: #2e7d32;
            margin-bottom: 15px;
        }

        .total-points .score {
            font-size: 3em;
            color: #4caf50;
            font-weight: bold;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 1.2em;
        }

        .no-data {
            text-align: center;
            padding: 40px;
            color: #999;
            font-size: 1.1em;
        }

        .export-buttons {
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
                margin: 5% auto;
            }

            .correction-controls {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Painel do Professor</h1>
        <p class="subtitle">Teste Narciso - Resultados e Correção</p>

        <!-- Estatísticas -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="totalAlunos">0</h3>
                <p>Total de Alunos</p>
            </div>
            <div class="stat-card">
                <h3 id="mediaGeral">0</h3>
                <p>Média Geral</p>
            </div>
            <div class="stat-card">
                <h3 id="alunosExcelente">0</h3>
                <p>Excelente (≥80)</p>
            </div>
            <div class="stat-card">
                <h3 id="alunosBom">0</h3>
                <p>Bom (60-79)</p>
            </div>
            <div class="stat-card">
                <h3 id="alunosMelhorar">0</h3>
                <p>A Melhorar (<60)</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filters">
            <label for="filterTurma">Turma:</label>
            <input type="text" id="filterTurma" placeholder="Ex: 4M, 4A..." onchange="filtrarResultados()">

            <label for="filterPontuacao">Pontuação:</label>
            <select id="filterPontuacao" onchange="filtrarResultados()">
                <option value="">Todas</option>
                <option value="80-100">Excelente (80-100)</option>
                <option value="60-79">Bom (60-79)</option>
                <option value="0-59">A Melhorar (0-59)</option>
            </select>

            <label for="filterData">Data:</label>
            <input type="date" id="filterData" onchange="filtrarResultados()">

            <button onclick="limparFiltros()">🔄 Limpar Filtros</button>
        </div>

        <!-- Botões -->
        <div class="export-buttons">
            <button class="btn-export" onclick="exportarRelatorioGeral()">📊 Exportar Relatório Geral (PDF)</button>
            <button class="btn-export" onclick="atualizarDados()">🔄 Atualizar Dados</button>
        </div>

        <!-- Tabela -->
        <div id="loadingMessage" class="loading">A carregar resultados...</div>
        <div id="noDataMessage" class="no-data" style="display: none;">
            Ainda não há resultados disponíveis.
        </div>

        <table class="results-table" id="resultsTable" style="display: none;">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Data/Hora</th>
                    <th>Pontuação</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <!-- Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- jsPDF para exportação PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKn6YGp4LnSTA4impkHSy5oKuljzosbNc",
            authDomain: "narciso-gramatica.firebaseapp.com",
            databaseURL: "https://narciso-gramatica-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "narciso-gramatica",
            storageBucket: "narciso-gramatica.firebasestorage.app",
            messagingSenderId: "911157010213",
            appId: "1:911157010213:web:7c3e9be440a09fbbe144cc"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let todosResultados = [];
        let resultadosFiltrados = [];
        let testeAtualId = null;

        window.addEventListener('load', () => {
            console.log('✅ Painel carregado');
            carregarResultados();
        });

        function carregarResultados() {
            const testesRef = database.ref('testes-narciso');
            
            testesRef.on('value', (snapshot) => {
                todosResultados = [];
                
                snapshot.forEach((childSnapshot) => {
                    const data = childSnapshot.val();
                    data.id = childSnapshot.key;
                    todosResultados.push(data);
                });

                todosResultados.sort((a, b) => {
                    return new Date(b.aluno.dataFim) - new Date(a.aluno.dataFim);
                });

                resultadosFiltrados = [...todosResultados];
                atualizarInterface();
            });
        }

        function atualizarInterface() {
            document.getElementById('loadingMessage').style.display = 'none';
            
            if (resultadosFiltrados.length === 0) {
                document.getElementById('noDataMessage').style.display = 'block';
                document.getElementById('resultsTable').style.display = 'none';
                return;
            }

            document.getElementById('noDataMessage').style.display = 'none';
            document.getElementById('resultsTable').style.display = 'table';

            atualizarEstatisticas();
            atualizarTabela();
        }

        function atualizarEstatisticas() {
            const total = resultadosFiltrados.length;
            let somaNotas = 0;
            let excelente = 0;
            let bom = 0;
            let melhorar = 0;

            resultadosFiltrados.forEach(resultado => {
                const nota = resultado.pontuacaoFinal || resultado.pontuacoes.total || 0;
                somaNotas += nota;

                if (nota >= 80) excelente++;
                else if (nota >= 60) bom++;
                else melhorar++;
            });

            const media = total > 0 ? Math.round(somaNotas / total) : 0;

            document.getElementById('totalAlunos').textContent = total;
            document.getElementById('mediaGeral').textContent = media;
            document.getElementById('alunosExcelente').textContent = excelente;
            document.getElementById('alunosBom').textContent = bom;
            document.getElementById('alunosMelhorar').textContent = melhorar;
        }

        function atualizarTabela() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';

            resultadosFiltrados.forEach(resultado => {
                const row = tbody.insertRow();
                const pontuacao = resultado.pontuacaoFinal || resultado.pontuacoes.total || 0;

                row.insertCell(0).textContent = resultado.aluno.nome;
                row.insertCell(1).textContent = resultado.aluno.turma;
                
                const dataFim = new Date(resultado.aluno.dataFim);
                row.insertCell(2).textContent = dataFim.toLocaleString('pt-PT');

                const cellPont = row.insertCell(3);
                const badge = document.createElement('span');
                badge.className = 'score-badge ' + getScoreClass(pontuacao);
                badge.textContent = pontuacao + '/100';
                cellPont.appendChild(badge);

                const cellAcoes = row.insertCell(4);
                
                // Botão Corrigir/Ver
                const btnVer = document.createElement('button');
                btnVer.className = 'btn-view';
                btnVer.textContent = '📝 Corrigir';
                btnVer.onclick = () => mostrarDetalhes(resultado);
                btnVer.style.marginRight = '5px';
                cellAcoes.appendChild(btnVer);
                
                // Botão PDF Individual
                const btnPDF = document.createElement('button');
                btnPDF.className = 'btn-view';
                btnPDF.style.background = '#f44336';
                btnPDF.style.marginRight = '5px';
                btnPDF.textContent = '📄 PDF';
                btnPDF.onclick = () => exportarPDFIndividual(resultado);
                cellAcoes.appendChild(btnPDF);
                
                // Botão Apagar
                const btnApagar = document.createElement('button');
                btnApagar.className = 'btn-view';
                btnApagar.style.background = '#9e9e9e';
                btnApagar.textContent = '🗑️ Apagar';
                btnApagar.onclick = () => apagarAluno(resultado);
                cellAcoes.appendChild(btnApagar);
            });
        }

        function getScoreClass(score) {
            if (score >= 80) return 'score-excellent';
            if (score >= 70) return 'score-good';
            if (score >= 50) return 'score-fair';
            return 'score-poor';
        }

        function mostrarDetalhes(resultado) {
            console.log('🔍 Abrindo correção:', resultado.aluno.nome);
            testeAtualId = resultado.id;
            
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            
            if (!modal || !content) {
                alert('❌ Erro: Modal não encontrado!');
                return;
            }

            // Calcular pontos atuais
            const correcaoManual = resultado.correcaoManual || {};
            let pontosRelatorio = 0;
            let pontosFrases = 0;
            let pontosConotativos = 0;

            // Pontos do relatório
            for (let i = 1; i <= 7; i++) {
                pontosRelatorio += parseInt(correcaoManual[`q${i}`] || 0);
            }

            // Pontos das frases
            for (let i = 1; i <= 3; i++) {
                pontosFrases += parseInt(correcaoManual[`frase${i}`] || 0);
            }

            // Pontos dos conotativos
            for (let i = 1; i <= 3; i++) {
                pontosConotativos += parseInt(correcaoManual[`conot${i}`] || 0);
            }

            // Pontos automáticos (25 pontos)
            const pontosGraus = Math.round((resultado.pontuacoes.porSeccao.graus || 0) * 12 / 100);
            const pontosConectores = Math.round((resultado.pontuacoes.porSeccao.conectores || 0) * 5 / 100);
            const pontosFlexao = Math.round((resultado.pontuacoes.porSeccao.flexao || 0) * 6 / 100);
            const pontosFamilia = Math.round((resultado.pontuacoes.porSeccao.familia || 0) * 2 / 100);

            const pontosAutomaticos = pontosGraus + pontosConectores + pontosFlexao + pontosFamilia;
            const pontosManuais = pontosRelatorio + pontosFrases + pontosConotativos;
            const pontuacaoTotal = pontosAutomaticos + pontosManuais;

            let html = `
                <h2>📝 Correção do Teste - ${resultado.aluno.nome}</h2>
                
                <div class="total-points">
                    <h3>Pontuação Total</h3>
                    <div class="score" id="pontuacaoDisplay">${pontuacaoTotal}/100</div>
                    <p style="margin-top: 10px; color: #666;">
                        Automático: ${pontosAutomaticos}/25 | Manual: ${pontosManuais}/75
                    </p>
                </div>

                <div class="detail-section" style="background: #fff3cd; border-left: 5px solid #ffc107;">
                    <h3 style="color: #856404;">⚠️ INSTRUÇÕES</h3>
                    <ul style="color: #856404; margin-left: 20px; line-height: 1.8;">
                        <li>Dá pontos em cada resposta aberta</li>
                        <li>Adiciona comentários para o aluno</li>
                        <li>Clica em "💾 GUARDAR CORREÇÃO" no final</li>
                        <li>A pontuação será atualizada automaticamente</li>
                    </ul>
                </div>

                <div class="detail-section" style="border: 3px solid #2196f3;">
                    <h3>📝 RELATÓRIO DO TEXTO (42 pontos)</h3>
                    <p style="margin-bottom: 15px; color: #666;">Cada pergunta vale <strong>6 pontos</strong></p>
            `;

            const perguntas = {
                q1: '1. Quem era Narciso e o que o tornava especial?',
                q2: '2. O que disse o profeta Tirésias sobre o destino de Narciso?',
                q3: '3. Como Narciso tratava as pessoas que se apaixonavam por ele?',
                q4: '4. O que aconteceu a Eco depois de Narciso a rejeitar?',
                q5: '5. Qual foi o castigo que Nêmesis aplicou a Narciso?',
                q6: '6. O que aconteceu a Narciso no final da história?',
                q7: '7. Que lição moral podemos tirar desta história?'
            };

            for (let q in perguntas) {
                const resposta = (resultado.respostas && resultado.respostas.relatorio && resultado.respostas.relatorio[q]) || '';
                const pontos = correcaoManual[q] || 0;
                const comentario = resultado.comentarios?.[q] || '';
                
                html += `
                    <div class="answer-item">
                        <strong style="font-size: 1.1em; color: #1976d2;">${perguntas[q]}</strong>
                        
                        <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; margin: 10px 0;">
                            <p style="line-height: 1.6;">${resposta || '<em style="color: #999;">Não respondeu</em>'}</p>
                        </div>
                        
                        <div class="correction-box">
                            <div class="correction-controls">
                                <label>Pontos:</label>
                                <input type="number" id="${q}_pontos" min="0" max="6" value="${pontos}" 
                                       onchange="calcularTotal()" style="width: 80px;">
                                <span style="font-weight: bold;">/6</span>
                                
                                <textarea id="${q}_comentario" placeholder="Comentário para o aluno (opcional)">${comentario}</textarea>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            // FRASES
            html += `
                <div class="detail-section" style="border: 3px solid #ff9800;">
                    <h3>✍️ FRASES CRIADAS (18 pontos)</h3>
                    <p style="margin-bottom: 15px; color: #666;">Cada frase vale <strong>6 pontos</strong></p>
            `;

            const frasesNomes = {
                frase1: '1. Frase sobre a beleza de Narciso',
                frase2: '2. Frase sobre o castigo',
                frase3: '3. Frase com conector de oposição'
            };

            for (let f in frasesNomes) {
                const resposta = (resultado.respostas && resultado.respostas.frases && resultado.respostas.frases[f]) || '';
                const pontos = correcaoManual[f] || 0;
                const comentario = resultado.comentarios?.[f] || '';
                
                html += `
                    <div class="answer-item">
                        <strong style="font-size: 1.1em; color: #e65100;">${frasesNomes[f]}</strong>
                        
                        <div style="background: #fff8e1; padding: 15px; border-radius: 8px; margin: 10px 0;">
                            <p style="line-height: 1.6;">${resposta || '<em style="color: #999;">Não escreveu</em>'}</p>
                        </div>
                        
                        <div class="correction-box">
                            <div class="correction-controls">
                                <label>Pontos:</label>
                                <input type="number" id="${f}_pontos" min="0" max="6" value="${pontos}" 
                                       onchange="calcularTotal()" style="width: 80px;">
                                <span style="font-weight: bold;">/6</span>
                                
                                <textarea id="${f}_comentario" placeholder="Comentário (opcional)">${comentario}</textarea>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            // CONOTATIVOS
            html += `
                <div class="detail-section" style="border: 3px solid #9c27b0;">
                    <h3>💭 SENTIDOS CONOTATIVOS (15 pontos)</h3>
                    <p style="margin-bottom: 15px; color: #666;">Cada resposta vale <strong>5 pontos</strong></p>
            `;

            const conotNomes = {
                conot1: '"Coração de pedra"',
                conot2: '"Perdeu-se em si mesmo"',
                conot3: '"Águas cristalinas"'
            };

            for (let c in conotNomes) {
                const resposta = (resultado.respostas && resultado.respostas.conotativos && resultado.respostas.conotativos[c]) || '';
                const pontos = correcaoManual[c] || 0;
                const comentario = resultado.comentarios?.[c] || '';
                
                html += `
                    <div class="answer-item">
                        <strong style="font-size: 1.1em; color: #7b1fa2;">${conotNomes[c]}</strong>
                        
                        <div style="background: #f3e5f5; padding: 15px; border-radius: 8px; margin: 10px 0;">
                            <p style="line-height: 1.6;">${resposta || '<em style="color: #999;">Não respondeu</em>'}</p>
                        </div>
                        
                        <div class="correction-box">
                            <div class="correction-controls">
                                <label>Pontos:</label>
                                <input type="number" id="${c}_pontos" min="0" max="5" value="${pontos}" 
                                       onchange="calcularTotal()" style="width: 80px;">
                                <span style="font-weight: bold;">/5</span>
                                
                                <textarea id="${c}_comentario" placeholder="Comentário (opcional)">${comentario}</textarea>
                            </div>
                        </div>
                    </div>
                `;
            }

            html += '</div>';

            // Secções automáticas (resumo)
            html += `
                <div class="detail-section" style="background: #e8f5e9;">
                    <h3>🤖 Pontuação Automática (25 pontos)</h3>
                    <ul style="line-height: 2;">
                        <li><strong>Graus:</strong> ${pontosGraus}/12 pontos</li>
                        <li><strong>Conectores:</strong> ${pontosConectores}/5 pontos</li>
                        <li><strong>Flexão:</strong> ${pontosFlexao}/6 pontos</li>
                        <li><strong>Família:</strong> ${pontosFamilia}/2 pontos</li>
                    </ul>
                </div>
            `;

            // Botão guardar
            html += `
                <button class="btn-save-correction" onclick="guardarCorrecao()">
                    💾 GUARDAR CORREÇÃO
                </button>
            `;

            content.innerHTML = html;
            modal.style.display = 'block';
            
            console.log('✅ Modal aberto');
        }

        function calcularTotal() {
            let total = 0;

            // Relatório (7 perguntas × 6 pontos)
            for (let i = 1; i <= 7; i++) {
                const input = document.getElementById(`q${i}_pontos`);
                if (input) total += parseInt(input.value) || 0;
            }

            // Frases (3 × 6 pontos)
            for (let i = 1; i <= 3; i++) {
                const input = document.getElementById(`frase${i}_pontos`);
                if (input) total += parseInt(input.value) || 0;
            }

            // Conotativos (3 × 5 pontos)
            for (let i = 1; i <= 3; i++) {
                const input = document.getElementById(`conot${i}_pontos`);
                if (input) total += parseInt(input.value) || 0;
            }

            // Adicionar pontos automáticos (25 pontos)
            const resultado = todosResultados.find(r => r.id === testeAtualId);
            if (resultado) {
                const pontosGraus = Math.round((resultado.pontuacoes.porSeccao.graus || 0) * 12 / 100);
                const pontosConectores = Math.round((resultado.pontuacoes.porSeccao.conectores || 0) * 5 / 100);
                const pontosFlexao = Math.round((resultado.pontuacoes.porSeccao.flexao || 0) * 6 / 100);
                const pontosFamilia = Math.round((resultado.pontuacoes.porSeccao.familia || 0) * 2 / 100);
                total += pontosGraus + pontosConectores + pontosFlexao + pontosFamilia;
            }

            const display = document.getElementById('pontuacaoDisplay');
            if (display) {
                display.textContent = `${total}/100`;
            }

            return total;
        }

        function guardarCorrecao() {
            if (!testeAtualId) {
                alert('❌ Erro: ID do teste não encontrado!');
                return;
            }

            if (!confirm('💾 Guardar esta correção no Firebase?')) return;

            // Coletar dados
            const correcaoManual = {};
            const comentarios = {};

            // Relatório (6 perguntas)
            for (let i = 1; i <= 6; i++) {
                const q = `q${i}`;
                correcaoManual[q] = parseInt(document.getElementById(`${q}_pontos`)?.value || 0);
                comentarios[q] = document.getElementById(`${q}_comentario`)?.value || '';
            }

            // Flexão (6)
            const flexIds = ['fem1', 'fem2', 'fem3', 'plur1', 'plur2', 'plur3'];
            flexIds.forEach(id => {
                correcaoManual[id] = parseInt(document.getElementById(`${id}_pontos`)?.value || 0);
                comentarios[id] = document.getElementById(`${id}_comentario`)?.value || '';
            });

            // Família (8)
            for (let i = 1; i <= 8; i++) {
                const f = `fam${i}`;
                correcaoManual[f] = parseInt(document.getElementById(`${f}_pontos`)?.value || 0);
                comentarios[f] = document.getElementById(`${f}_comentario`)?.value || '';
            }

            // Frases
            for (let i = 1; i <= 3; i++) {
                const f = `frase${i}`;
                correcaoManual[f] = parseInt(document.getElementById(`${f}_pontos`)?.value || 0);
                comentarios[f] = document.getElementById(`${f}_comentario`)?.value || '';
            }

            // Conotativos
            for (let i = 1; i <= 3; i++) {
                const c = `conot${i}`;
                correcaoManual[c] = parseInt(document.getElementById(`${c}_pontos`)?.value || 0);
                comentarios[c] = document.getElementById(`${c}_comentario`)?.value || '';
            }

            const pontuacaoFinal = calcularTotal();

            // Guardar no Firebase
            const testeRef = database.ref('testes-narciso/' + testeAtualId);
            testeRef.update({
                correcaoManual: correcaoManual,
                comentarios: comentarios,
                pontuacaoFinal: pontuacaoFinal,
                dataCorrecao: new Date().toISOString()
            })
            .then(() => {
                alert('✅ Correção guardada com sucesso!');
                fecharModal();
                atualizarDados();
            })
            .catch((error) => {
                alert('❌ Erro ao guardar: ' + error.message);
            });
        }

        function fecharModal() {
            document.getElementById('detailModal').style.display = 'none';
            testeAtualId = null;
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target == modal) {
                fecharModal();
            }
        }

        function filtrarResultados() {
            const filterTurma = document.getElementById('filterTurma').value.trim().toLowerCase();
            const filterPontuacao = document.getElementById('filterPontuacao').value;
            const filterData = document.getElementById('filterData').value;

            resultadosFiltrados = todosResultados.filter(resultado => {
                if (filterTurma && !resultado.aluno.turma.toLowerCase().includes(filterTurma)) {
                    return false;
                }

                if (filterPontuacao) {
                    const pontuacao = resultado.pontuacaoFinal || resultado.pontuacoes.total || 0;
                    if (filterPontuacao === '80-100' && pontuacao < 80) return false;
                    if (filterPontuacao === '60-79' && (pontuacao < 60 || pontuacao >= 80)) return false;
                    if (filterPontuacao === '0-59' && pontuacao >= 60) return false;
                }

                if (filterData) {
                    const dataResultado = new Date(resultado.aluno.dataFim).toISOString().split('T')[0];
                    if (dataResultado !== filterData) return false;
                }

                return true;
            });

            atualizarInterface();
        }

        function limparFiltros() {
            document.getElementById('filterTurma').value = '';
            document.getElementById('filterPontuacao').value = '';
            document.getElementById('filterData').value = '';
            filtrarResultados();
        }

        // ===== EXPORTAÇÃO PDF =====
        
        function exportarRelatorioGeral() {
            if (resultadosFiltrados.length === 0) {
                alert('Não há dados para exportar!');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();

            // Cabeçalho
            doc.setFontSize(18);
            doc.setTextColor(31, 78, 120);
            doc.text('RELATÓRIO GERAL - TESTE NARCISO', 105, 20, { align: 'center' });
            
            doc.setFontSize(10);
            doc.setTextColor(100);
            doc.text(`Data de Exportação: ${new Date().toLocaleDateString('pt-PT')}`, 105, 28, { align: 'center' });
            doc.text(`Total de Alunos: ${resultadosFiltrados.length}`, 105, 34, { align: 'center' });

            // Estatísticas
            let somaNotas = 0;
            resultadosFiltrados.forEach(r => {
                somaNotas += r.pontuacaoFinal || r.pontuacoes.total || 0;
            });
            const media = Math.round(somaNotas / resultadosFiltrados.length);
            
            doc.text(`Média da Turma: ${media}/100`, 105, 40, { align: 'center' });

            // Tabela
            const tableData = resultadosFiltrados.map(resultado => {
                const pontuacao = resultado.pontuacaoFinal || resultado.pontuacoes.total || 0;
                const dataFim = new Date(resultado.aluno.dataFim);
                
                return [
                    resultado.aluno.nome,
                    resultado.aluno.turma,
                    dataFim.toLocaleDateString('pt-PT'),
                    pontuacao + '/100'
                ];
            });

            doc.autoTable({
                startY: 50,
                head: [['Nome', 'Turma', 'Data', 'Pontuação']],
                body: tableData,
                theme: 'grid',
                styles: { fontSize: 10, cellPadding: 5 },
                headStyles: { fillColor: [102, 126, 234], textColor: 255 },
                alternateRowStyles: { fillColor: [245, 245, 245] }
            });

            doc.save(`Relatorio_Geral_Narciso_${new Date().toISOString().split('T')[0]}.pdf`);
        }

        function exportarPDFIndividual(resultado) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            let yPos = 20;
            const margemEsquerda = 15;
            const larguraPagina = 180;

            // === CABEÇALHO ===
            doc.setFontSize(16);
            doc.setTextColor(31, 78, 120);
            doc.text('TESTE DE GRAMÁTICA - NARCISO', 105, yPos, { align: 'center' });
            yPos += 10;

            doc.setFontSize(11);
            doc.setTextColor(50);
            doc.text(`Aluno: ${resultado.aluno.nome}`, margemEsquerda, yPos);
            yPos += 6;
            doc.text(`Turma: ${resultado.aluno.turma}`, margemEsquerda, yPos);
            yPos += 6;
            doc.text(`Data: ${new Date(resultado.aluno.dataFim).toLocaleString('pt-PT')}`, margemEsquerda, yPos);
            yPos += 6;
            
            const pontuacaoFinal = resultado.pontuacaoFinal || resultado.pontuacoes.total || 0;
            doc.setFontSize(13);
            doc.setTextColor(76, 175, 80);
            doc.text(`Pontuação Final: ${pontuacaoFinal}/100`, margemEsquerda, yPos);
            yPos += 12;

            // === RELATÓRIO DO TEXTO ===
            doc.setFontSize(12);
            doc.setTextColor(31, 78, 120);
            doc.text('RELATORIO DO TEXTO', margemEsquerda, yPos);
            yPos += 8;

            const perguntas = {
                q1: '1. O que disse o profeta Tiresias sobre o destino de Narciso?',
                q2: '2. Como Narciso tratava as pessoas que se apaixonavam por ele?',
                q3: '3. O que aconteceu a Eco depois de Narciso a rejeitar?',
                q4: '4. Qual foi o castigo que Nemesis aplicou a Narciso?',
                q5: '5. O que aconteceu a Narciso no final da historia?',
                q6: '6. Que licao moral podemos tirar desta historia?'
            };

            doc.setFontSize(9);
            doc.setTextColor(50);

            for (let q in perguntas) {
                if (yPos > 270) {
                    doc.addPage();
                    yPos = 20;
                }

                // Pergunta
                doc.setFont(undefined, 'bold');
                const linhasPergunta = doc.splitTextToSize(perguntas[q], larguraPagina);
                doc.text(linhasPergunta, margemEsquerda, yPos);
                yPos += linhasPergunta.length * 5;

                // Resposta
                doc.setFont(undefined, 'normal');
                const resposta = (resultado.respostas && resultado.respostas.relatorio && resultado.respostas.relatorio[q]) || '(Não respondeu)';
                const linhasResposta = doc.splitTextToSize(`Resposta: ${resposta}`, larguraPagina - 5);
                doc.text(linhasResposta, margemEsquerda + 3, yPos);
                yPos += linhasResposta.length * 4 + 2;

                // Pontuação e Comentário
                if (resultado.correcaoManual && resultado.correcaoManual[q] !== undefined) {
                    doc.setTextColor(76, 175, 80);
                    doc.text(`Pontos: ${resultado.correcaoManual[q]}/5`, margemEsquerda + 3, yPos);
                    yPos += 5;
                }

                if (resultado.comentarios && resultado.comentarios[q]) {
                    doc.setTextColor(255, 152, 0);
                    const linhasComentario = doc.splitTextToSize(`💬 ${resultado.comentarios[q]}`, larguraPagina - 5);
                    doc.text(linhasComentario, margemEsquerda + 3, yPos);
                    yPos += linhasComentario.length * 4;
                }

                doc.setTextColor(50);
                yPos += 4;
            }

            // === FRASES CRIADAS ===
            if (yPos > 250) {
                doc.addPage();
                yPos = 20;
            }

            yPos += 5;
            doc.setFontSize(12);
            doc.setTextColor(31, 78, 120);
            doc.text('✍️ FRASES CRIADAS', margemEsquerda, yPos);
            yPos += 8;

            doc.setFontSize(9);
            doc.setTextColor(50);

            const frasesNomes = {
                frase1: '1. Frase sobre a beleza de Narciso',
                frase2: '2. Frase sobre o castigo',
                frase3: '3. Frase com conector de oposição'
            };

            for (let f in frasesNomes) {
                if (yPos > 270) {
                    doc.addPage();
                    yPos = 20;
                }

                doc.setFont(undefined, 'bold');
                doc.text(frasesNomes[f], margemEsquerda, yPos);
                yPos += 5;

                doc.setFont(undefined, 'normal');
                const resposta = (resultado.respostas && resultado.respostas.frases && resultado.respostas.frases[f]) || '(Não escreveu)';
                const linhas = doc.splitTextToSize(`Resposta: ${resposta}`, larguraPagina - 5);
                doc.text(linhas, margemEsquerda + 3, yPos);
                yPos += linhas.length * 4 + 2;

                if (resultado.correcaoManual && resultado.correcaoManual[f] !== undefined) {
                    doc.setTextColor(76, 175, 80);
                    doc.text(`Pontos: ${resultado.correcaoManual[f]}/5`, margemEsquerda + 3, yPos);
                    yPos += 5;
                }

                if (resultado.comentarios && resultado.comentarios[f]) {
                    doc.setTextColor(255, 152, 0);
                    const linhasComentario = doc.splitTextToSize(`💬 ${resultado.comentarios[f]}`, larguraPagina - 5);
                    doc.text(linhasComentario, margemEsquerda + 3, yPos);
                    yPos += linhasComentario.length * 4;
                }

                doc.setTextColor(50);
                yPos += 4;
            }

            // === SENTIDOS CONOTATIVOS ===
            if (yPos > 250) {
                doc.addPage();
                yPos = 20;
            }

            yPos += 5;
            doc.setFontSize(12);
            doc.setTextColor(31, 78, 120);
            doc.text('💭 SENTIDOS CONOTATIVOS', margemEsquerda, yPos);
            yPos += 8;

            doc.setFontSize(9);
            doc.setTextColor(50);

            const conotNomes = {
                conot1: '"Coração de pedra"',
                conot2: '"Perdeu-se em si mesmo"',
                conot3: '"Águas cristalinas"'
            };

            for (let c in conotNomes) {
                if (yPos > 270) {
                    doc.addPage();
                    yPos = 20;
                }

                doc.setFont(undefined, 'bold');
                doc.text(conotNomes[c], margemEsquerda, yPos);
                yPos += 5;

                doc.setFont(undefined, 'normal');
                const resposta = (resultado.respostas && resultado.respostas.conotativos && resultado.respostas.conotativos[c]) || '(Não respondeu)';
                const linhas = doc.splitTextToSize(`Resposta: ${resposta}`, larguraPagina - 5);
                doc.text(linhas, margemEsquerda + 3, yPos);
                yPos += linhas.length * 4 + 2;

                if (resultado.correcaoManual && resultado.correcaoManual[c] !== undefined) {
                    doc.setTextColor(76, 175, 80);
                    doc.text(`Pontos: ${resultado.correcaoManual[c]}/4`, margemEsquerda + 3, yPos);
                    yPos += 5;
                }

                if (resultado.comentarios && resultado.comentarios[c]) {
                    doc.setTextColor(255, 152, 0);
                    const linhasComentario = doc.splitTextToSize(`💬 ${resultado.comentarios[c]}`, larguraPagina - 5);
                    doc.text(linhasComentario, margemEsquerda + 3, yPos);
                    yPos += linhasComentario.length * 4;
                }

                doc.setTextColor(50);
                yPos += 4;
            }

            // === RESUMO FINAL ===
            if (yPos > 250) {
                doc.addPage();
                yPos = 20;
            }

            yPos += 10;
            doc.setFontSize(12);
            doc.setTextColor(31, 78, 120);
            doc.text('───────────────────────────────', 105, yPos, { align: 'center' });
            yPos += 7;
            doc.text('RESUMO FINAL', 105, yPos, { align: 'center' });
            yPos += 7;
            doc.text('───────────────────────────────', 105, yPos, { align: 'center' });
            yPos += 10;

            doc.setFontSize(11);
            doc.setTextColor(50);
            doc.text(`Pontuação Final: ${pontuacaoFinal}/100`, 105, yPos, { align: 'center' });

            // Salvar
            const nomeArquivo = `Teste_${resultado.aluno.nome.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.pdf`;
            doc.save(nomeArquivo);
        }

        function atualizarDados() {
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('resultsTable').style.display = 'none';
            carregarResultados();
        }

        // ===== APAGAR ALUNO =====
        function apagarAluno(resultado) {
            if (!confirm(`⚠️ APAGAR teste de ${resultado.aluno.nome}?\n\nTurma: ${resultado.aluno.turma}\nData: ${new Date(resultado.aluno.dataFim).toLocaleDateString('pt-PT')}\n\nEsta ação NÃO pode ser desfeita!`)) {
                return;
            }
            
            const testeRef = database.ref('testes-narciso/' + resultado.id);
            testeRef.remove()
                .then(() => {
                    alert('✅ Teste apagado com sucesso!');
                    atualizarDados();
                })
                .catch((error) => {
                    alert('❌ Erro ao apagar: ' + error.message);
                    console.error('Erro:', error);
                });
        }
    </script>

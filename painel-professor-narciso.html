<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Professor - Teste Narciso</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 { color: #1F4E78; text-align: center; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
        }
        .stat-card h3 { font-size: 2em; margin-bottom: 5px; }
        .filters {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        .filters label { font-weight: bold; color: #2E5090; }
        .filters select, .filters input {
            padding: 8px 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .filters button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        .results-table th, .results-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .results-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .results-table tr:hover { background: #f5f5f5; }
        .score-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9em;
        }
        .score-excellent { background: #4caf50; color: white; }
        .score-good { background: #8bc34a; color: white; }
        .score-fair { background: #ff9800; color: white; }
        .score-poor { background: #f44336; color: white; }
        .score-pending { background: #9e9e9e; color: white; }
        .btn-view {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 2px;
        }
        .btn-view:hover { background: #5568d3; }
        .btn-pdf { background: #f44336; }
        .btn-export {
            background: #4caf50;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            margin: 10px 5px;
        }
        .export-buttons { text-align: center; margin: 20px 0; }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
        }
        .modal-content {
            background: white;
            margin: 2% auto;
            padding: 30px;
            border-radius: 20px;
            width: 95%;
            max-width: 1200px;
            max-height: 94vh;
            overflow-y: auto;
        }
        .close {
            color: #999;
            float: right;
            font-size: 32px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover { color: #333; }
        .modal h2 {
            color: #1F4E78;
            margin-bottom: 20px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 10px;
        }
        .detail-section {
            margin: 20px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }
        .detail-section h3 { color: #2E5090; margin-bottom: 15px; }
        .answer-item {
            margin: 15px 0;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .answer-item strong { color: #2E5090; display: block; margin-bottom: 8px; }
        .correction-box {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0;
        }
        .correction-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .correction-controls label { font-weight: bold; color: #856404; }
        .correction-controls input[type="number"] {
            width: 70px;
            padding: 8px;
            border: 2px solid #ffc107;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            text-align: center;
        }
        .correction-controls textarea {
            flex: 1;
            min-width: 200px;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 5px;
            min-height: 50px;
        }
        .btn-save-correction {
            background: #4caf50;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin: 30px auto;
            display: block;
        }
        .btn-save-correction:hover { background: #45a049; }
        .total-points {
            background: #e8f5e9;
            border: 3px solid #4caf50;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .total-points .score { font-size: 2.5em; color: #4caf50; font-weight: bold; }
        .loading, .no-data { text-align: center; padding: 40px; color: #667eea; }
        .auto-section { background: #e8f5e9; border-left: 4px solid #4caf50; }
        .manual-section { background: #fff3cd; border-left: 4px solid #ffc107; }
        @media (max-width: 768px) {
            .container { padding: 15px; }
            .modal-content { width: 98%; padding: 15px; }
            .correction-controls { flex-direction: column; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Painel do Professor</h1>
        <p class="subtitle">Teste Narciso - Correção Manual</p>

        <div class="stats-grid">
            <div class="stat-card"><h3 id="totalAlunos">0</h3><p>Alunos</p></div>
            <div class="stat-card"><h3 id="mediaGeral">-</h3><p>Média</p></div>
            <div class="stat-card"><h3 id="corrigidos">0</h3><p>Corrigidos</p></div>
            <div class="stat-card"><h3 id="pendentes">0</h3><p>Pendentes</p></div>
        </div>

        <div class="filters">
            <label>Turma:</label>
            <input type="text" id="filterTurma" placeholder="Ex: 4M" onchange="filtrarResultados()">
            <label>Estado:</label>
            <select id="filterStatus" onchange="filtrarResultados()">
                <option value="">Todos</option>
                <option value="corrigido">Corrigidos</option>
                <option value="pendente">Pendentes</option>
            </select>
            <button onclick="limparFiltros()">🔄 Limpar</button>
        </div>

        <div class="export-buttons">
            <button class="btn-export" onclick="exportarRelatorioGeral()">📊 Relatório Geral (PDF)</button>
            <button class="btn-export" onclick="atualizarDados()">🔄 Atualizar</button>
        </div>

        <div id="loadingMessage" class="loading">A carregar...</div>
        <div id="noDataMessage" class="no-data" style="display: none;">Sem resultados.</div>

        <table class="results-table" id="resultsTable" style="display: none;">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Turma</th>
                    <th>Data</th>
                    <th>Auto</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="resultsBody"></tbody>
        </table>
    </div>

    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="fecharModal()">&times;</span>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCKn6YGp4LnSTA4impkHSy5oKuljzosbNc",
            authDomain: "narciso-gramatica.firebaseapp.com",
            databaseURL: "https://narciso-gramatica-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "narciso-gramatica",
            storageBucket: "narciso-gramatica.firebasestorage.app",
            messagingSenderId: "911157010213",
            appId: "1:911157010213:web:7c3e9be440a09fbbe144cc"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let todosResultados = [];
        let resultadosFiltrados = [];
        let testeAtualId = null;

        window.addEventListener('load', carregarResultados);

        function carregarResultados() {
            database.ref('testes-narciso').on('value', (snapshot) => {
                todosResultados = [];
                snapshot.forEach((child) => {
                    const data = child.val();
                    data.id = child.key;
                    todosResultados.push(data);
                });
                todosResultados.sort((a, b) => new Date(b.aluno.dataFim) - new Date(a.aluno.dataFim));
                resultadosFiltrados = [...todosResultados];
                atualizarInterface();
            });
        }

        function atualizarInterface() {
            document.getElementById('loadingMessage').style.display = 'none';
            if (resultadosFiltrados.length === 0) {
                document.getElementById('noDataMessage').style.display = 'block';
                document.getElementById('resultsTable').style.display = 'none';
                return;
            }
            document.getElementById('noDataMessage').style.display = 'none';
            document.getElementById('resultsTable').style.display = 'table';
            atualizarEstatisticas();
            atualizarTabela();
        }

        function atualizarEstatisticas() {
            let soma = 0, corrigidos = 0, pendentes = 0;
            resultadosFiltrados.forEach(r => {
                if (r.correcaoManual) { corrigidos++; soma += r.pontuacaoFinal || 0; }
                else pendentes++;
            });
            document.getElementById('totalAlunos').textContent = resultadosFiltrados.length;
            document.getElementById('mediaGeral').textContent = corrigidos > 0 ? Math.round(soma / corrigidos) : '-';
            document.getElementById('corrigidos').textContent = corrigidos;
            document.getElementById('pendentes').textContent = pendentes;
        }

        function atualizarTabela() {
            const tbody = document.getElementById('resultsBody');
            tbody.innerHTML = '';
            resultadosFiltrados.forEach(r => {
                const row = tbody.insertRow();
                const auto = (r.pontuacoes?.graus || 0) + (r.pontuacoes?.conectores || 0);
                const corrigido = r.correcaoManual != null;

                row.insertCell(0).textContent = r.aluno.nome;
                row.insertCell(1).textContent = r.aluno.turma;
                row.insertCell(2).textContent = new Date(r.aluno.dataFim).toLocaleDateString('pt-PT');
                row.insertCell(3).textContent = auto + '/25';

                const cellTotal = row.insertCell(4);
                if (corrigido && r.pontuacaoFinal != null) {
                    const badge = document.createElement('span');
                    badge.className = 'score-badge ' + getScoreClass(r.pontuacaoFinal);
                    badge.textContent = r.pontuacaoFinal + '/100';
                    cellTotal.appendChild(badge);
                } else {
                    cellTotal.innerHTML = '<span class="score-badge score-pending">Pendente</span>';
                }

                row.insertCell(5).innerHTML = corrigido ? '<span style="color:#4caf50;">✅</span>' : '<span style="color:#ff9800;">⏳</span>';

                const cellAcoes = row.insertCell(6);
                const btnCorrigir = document.createElement('button');
                btnCorrigir.className = 'btn-view';
                btnCorrigir.textContent = corrigido ? '✏️ Editar' : '📝 Corrigir';
                btnCorrigir.onclick = () => mostrarDetalhes(r);
                cellAcoes.appendChild(btnCorrigir);

                if (corrigido) {
                    const btnPDF = document.createElement('button');
                    btnPDF.className = 'btn-view btn-pdf';
                    btnPDF.textContent = '📄 PDF';
                    btnPDF.onclick = () => exportarPDFIndividual(r);
                    cellAcoes.appendChild(btnPDF);
                }
            });
        }

        function getScoreClass(score) {
            if (score >= 80) return 'score-excellent';
            if (score >= 60) return 'score-good';
            if (score >= 40) return 'score-fair';
            return 'score-poor';
        }

        function mostrarDetalhes(resultado) {
            testeAtualId = resultado.id;
            const correcao = resultado.correcaoManual || {};
            const comentarios = resultado.comentarios || {};
            const respostas = resultado.respostas || {};
            const auto = (resultado.pontuacoes?.graus || 0) + (resultado.pontuacoes?.conectores || 0);

            let html = `
                <h2>📝 Correção - ${resultado.aluno.nome} (${resultado.aluno.turma})</h2>
                <div class="total-points">
                    <p>Pontuação Total</p>
                    <div class="score" id="pontuacaoDisplay">---</div>
                    <p style="margin-top:10px;color:#666;">Auto: ${auto}/25 | Manual: <span id="manualDisplay">0</span>/75</p>
                </div>

                <div class="detail-section auto-section">
                    <h3>🤖 Automático (25 pontos)</h3>
                    <p>Graus: ${resultado.pontuacoes?.graus || 0}/15 | Conectores: ${resultado.pontuacoes?.conectores || 0}/10</p>
                </div>
            `;

            // Relatório (6 perguntas × 5 pontos = 30)
            html += `<div class="detail-section manual-section"><h3>📝 RELATÓRIO (30 pts - 5/pergunta)</h3>`;
            const pergsRelatorio = {
                q1: '1. O que disse Tirésias?',
                q2: '2. Como Narciso tratava as pessoas?',
                q3: '3. O que aconteceu a Eco?',
                q4: '4. Qual foi o castigo de Nêmesis?',
                q5: '5. O que aconteceu no final?',
                q6: '6. Que lição moral?'
            };
            for (let q in pergsRelatorio) {
                html += criarCampoCorrecao(q, pergsRelatorio[q], respostas.relatorio?.[q], correcao[q], comentarios[q], 5);
            }
            html += '</div>';

            // Flexão (6 × 2 = 12)
            html += `<div class="detail-section manual-section"><h3>🔄 FLEXÃO (12 pts - 2/resposta)</h3>`;
            const pergsFlexao = {
                fem1: '1. O jovem belo → feminino',
                fem2: '2. O deus poderoso → feminino',
                fem3: '3. O profeta sábio → feminino',
                plur1: '4. A ninfa generosa → plural',
                plur2: '5. O lago transparente → plural',
                plur3: '6. A flor perfumada → plural'
            };
            for (let f in pergsFlexao) {
                html += criarCampoCorrecao(f, pergsFlexao[f], respostas.flexao?.[f], correcao[f], comentarios[f], 2);
            }
            html += '</div>';

            // Família (8 × 2 = 16)
            html += `<div class="detail-section manual-section"><h3>👨‍👩‍👧‍👦 FAMÍLIA (16 pts - 2/resposta)</h3>`;
            const pergsFamilia = {
                fam1: '1. Verbo de "belo"',
                fam2: '2. Superlativo de "belo"',
                fam3: '3. Verbo de "amor"',
                fam4: '4. Advérbio de "amor"',
                fam5: '5. Composta de "água"',
                fam6: '6. Família de "água"',
                fam7: '7. Coletivo de "flor"',
                fam8: '8. Adjetivo de "flor"'
            };
            for (let f in pergsFamilia) {
                html += criarCampoCorrecao(f, pergsFamilia[f], respostas.familia?.[f], correcao[f], comentarios[f], 2);
            }
            html += '</div>';

            // Frases (3 × 4 = 12)
            html += `<div class="detail-section manual-section"><h3>✍️ FRASES (12 pts - 4/frase)</h3>`;
            const pergsFrases = {
                frase1: '1. Frase sobre a beleza',
                frase2: '2. Frase sobre o castigo',
                frase3: '3. Frase com conector'
            };
            for (let f in pergsFrases) {
                html += criarCampoCorrecao(f, pergsFrases[f], respostas.frases?.[f], correcao[f], comentarios[f], 4);
            }
            html += '</div>';

            // Conotativos (3 ≈ 5 total, ~1.67 cada, arredondamos para 2+2+1)
            html += `<div class="detail-section manual-section"><h3>💭 CONOTATIVOS (5 pts)</h3>`;
            const pergsConot = {
                conot1: '"Coração de pedra"',
                conot2: '"Perdeu-se em si mesmo"',
                conot3: '"Águas cristalinas"'
            };
            for (let c in pergsConot) {
                html += criarCampoCorrecao(c, pergsConot[c], respostas.conotativos?.[c], correcao[c], comentarios[c], 2);
            }
            html += '</div>';

            // Comentário geral
            html += `
                <div class="detail-section">
                    <h3>💬 Comentário Geral</h3>
                    <textarea id="comentarioGeral" style="width:100%;min-height:80px;padding:12px;border:2px solid #ddd;border-radius:8px;">${comentarios.geral || ''}</textarea>
                </div>
                <button class="btn-save-correction" onclick="guardarCorrecao()">💾 GUARDAR CORREÇÃO</button>
            `;

            document.getElementById('modalContent').innerHTML = html;
            document.getElementById('detailModal').style.display = 'block';
            setTimeout(calcularTotal, 100);
        }

        function criarCampoCorrecao(id, pergunta, resposta, pontos, comentario, max) {
            return `
                <div class="answer-item">
                    <strong>${pergunta}</strong>
                    <div style="background:#e3f2fd;padding:12px;border-radius:8px;margin:10px 0;">
                        <p>${resposta || '<em style="color:#999;">Não respondeu</em>'}</p>
                    </div>
                    <div class="correction-box">
                        <div class="correction-controls">
                            <label>Pontos:</label>
                            <input type="number" id="${id}_pontos" min="0" max="${max}" value="${pontos || 0}" onchange="calcularTotal()">
                            <span>/${max}</span>
                            <textarea id="${id}_comentario" placeholder="Comentário...">${comentario || ''}</textarea>
                        </div>
                    </div>
                </div>
            `;
        }

        function calcularTotal() {
            let manual = 0;
            const campos = [
                'q1','q2','q3','q4','q5','q6',
                'fem1','fem2','fem3','plur1','plur2','plur3',
                'fam1','fam2','fam3','fam4','fam5','fam6','fam7','fam8',
                'frase1','frase2','frase3',
                'conot1','conot2','conot3'
            ];
            campos.forEach(id => {
                manual += parseInt(document.getElementById(id + '_pontos')?.value || 0);
            });

            const resultado = todosResultados.find(r => r.id === testeAtualId);
            const auto = (resultado?.pontuacoes?.graus || 0) + (resultado?.pontuacoes?.conectores || 0);
            const total = auto + manual;

            document.getElementById('pontuacaoDisplay').textContent = total + '/100';
            document.getElementById('manualDisplay').textContent = manual;
            return { total, manual, auto };
        }

        function guardarCorrecao() {
            if (!testeAtualId) return alert('Erro!');
            if (!confirm('Guardar correção?')) return;

            const correcaoManual = {};
            const comentarios = {};
            const campos = [
                'q1','q2','q3','q4','q5','q6',
                'fem1','fem2','fem3','plur1','plur2','plur3',
                'fam1','fam2','fam3','fam4','fam5','fam6','fam7','fam8',
                'frase1','frase2','frase3',
                'conot1','conot2','conot3'
            ];
            campos.forEach(id => {
                correcaoManual[id] = parseInt(document.getElementById(id + '_pontos')?.value || 0);
                comentarios[id] = document.getElementById(id + '_comentario')?.value || '';
            });
            comentarios.geral = document.getElementById('comentarioGeral')?.value || '';

            const { total } = calcularTotal();

            database.ref('testes-narciso/' + testeAtualId).update({
                correcaoManual, comentarios, pontuacaoFinal: total,
                dataCorrecao: new Date().toISOString()
            }).then(() => {
                alert('✅ Guardado!');
                fecharModal();
            }).catch(err => alert('Erro: ' + err.message));
        }

        function fecharModal() {
            document.getElementById('detailModal').style.display = 'none';
            testeAtualId = null;
        }

        window.onclick = (e) => {
            if (e.target == document.getElementById('detailModal')) fecharModal();
        };

        function filtrarResultados() {
            const turma = document.getElementById('filterTurma').value.trim().toLowerCase();
            const status = document.getElementById('filterStatus').value;
            resultadosFiltrados = todosResultados.filter(r => {
                if (turma && !r.aluno.turma.toLowerCase().includes(turma)) return false;
                if (status === 'corrigido' && !r.correcaoManual) return false;
                if (status === 'pendente' && r.correcaoManual) return false;
                return true;
            });
            atualizarInterface();
        }

        function limparFiltros() {
            document.getElementById('filterTurma').value = '';
            document.getElementById('filterStatus').value = '';
            resultadosFiltrados = [...todosResultados];
            atualizarInterface();
        }

        function atualizarDados() {
            document.getElementById('loadingMessage').style.display = 'block';
            document.getElementById('resultsTable').style.display = 'none';
            carregarResultados();
        }

        function exportarRelatorioGeral() {
            if (resultadosFiltrados.length === 0) return alert('Sem dados!');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(16);
            doc.text('RELATORIO GERAL - TESTE NARCISO', 105, 20, { align: 'center' });
            doc.setFontSize(10);
            doc.text('Data: ' + new Date().toLocaleDateString('pt-PT') + ' | Alunos: ' + resultadosFiltrados.length, 105, 28, { align: 'center' });

            const tableData = resultadosFiltrados.map(r => [
                r.aluno.nome,
                r.aluno.turma,
                new Date(r.aluno.dataFim).toLocaleDateString('pt-PT'),
                ((r.pontuacoes?.graus || 0) + (r.pontuacoes?.conectores || 0)) + '/25',
                r.pontuacaoFinal != null ? r.pontuacaoFinal + '/100' : 'Pendente'
            ]);

            doc.autoTable({
                startY: 40,
                head: [['Nome', 'Turma', 'Data', 'Auto', 'Total']],
                body: tableData,
                theme: 'grid',
                headStyles: { fillColor: [102, 126, 234] }
            });
            doc.save('Relatorio_Geral.pdf');
        }

        function exportarPDFIndividual(resultado) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let y = 15;
            const m = 15;

            doc.setFillColor(102, 126, 234);
            doc.rect(0, 0, 210, 35, 'F');
            doc.setTextColor(255);
            doc.setFontSize(16);
            doc.text('TESTE DE GRAMATICA - NARCISO', 105, 12, { align: 'center' });
            doc.setFontSize(11);
            doc.text('Aluno: ' + resultado.aluno.nome + ' | Turma: ' + resultado.aluno.turma, 105, 22, { align: 'center' });
            doc.text('Data: ' + new Date(resultado.aluno.dataFim).toLocaleDateString('pt-PT'), 105, 30, { align: 'center' });

            y = 45;
            doc.setTextColor(0);
            doc.setFillColor(232, 245, 233);
            doc.rect(m, y, 180, 15, 'F');
            doc.setFontSize(14);
            doc.setTextColor(46, 125, 50);
            doc.text('PONTUACAO FINAL: ' + (resultado.pontuacaoFinal || 0) + '/100', 105, y + 10, { align: 'center' });
            y += 25;

            doc.setFontSize(9);
            doc.setTextColor(50);

            const addSection = (titulo, perguntas, respostas, correcao, comentarios, maxPts) => {
                if (y > 250) { doc.addPage(); y = 20; }
                doc.setFontSize(11);
                doc.setTextColor(31, 78, 120);
                doc.text(titulo, m, y);
                y += 7;
                doc.setFontSize(9);
                doc.setTextColor(50);

                for (let key in perguntas) {
                    if (y > 270) { doc.addPage(); y = 20; }
                    const resp = respostas?.[key] || '(Nao respondeu)';
                    const pts = correcao?.[key] || 0;
                    const com = comentarios?.[key] || '';

                    doc.setFont(undefined, 'bold');
                    doc.text(perguntas[key], m, y);
                    y += 5;
                    doc.setFont(undefined, 'normal');
                    const lines = doc.splitTextToSize('R: ' + resp, 175);
                    doc.text(lines, m + 3, y);
                    y += lines.length * 4 + 2;
                    doc.setTextColor(46, 125, 50);
                    doc.text('Pontos: ' + pts + '/' + maxPts, m + 3, y);
                    y += 5;
                    if (com) {
                        doc.setTextColor(255, 152, 0);
                        doc.text('Comentario: ' + com, m + 3, y);
                        y += 5;
                    }
                    doc.setTextColor(50);
                    y += 3;
                }
            };

            addSection('RELATORIO (30 pts)', {
                q1: '1. Tiresias?', q2: '2. Pessoas?', q3: '3. Eco?',
                q4: '4. Nemesis?', q5: '5. Final?', q6: '6. Licao?'
            }, resultado.respostas?.relatorio, resultado.correcaoManual, resultado.comentarios, 5);

            addSection('FLEXAO (12 pts)', {
                fem1: '1. Jovem belo', fem2: '2. Deus poderoso', fem3: '3. Profeta sabio',
                plur1: '4. Ninfa generosa', plur2: '5. Lago transparente', plur3: '6. Flor perfumada'
            }, resultado.respostas?.flexao, resultado.correcaoManual, resultado.comentarios, 2);

            addSection('FAMILIA (16 pts)', {
                fam1: '1. Verbo belo', fam2: '2. Superlativo', fam3: '3. Verbo amor', fam4: '4. Adverbio',
                fam5: '5. Composta agua', fam6: '6. Familia agua', fam7: '7. Coletivo flor', fam8: '8. Adjetivo flor'
            }, resultado.respostas?.familia, resultado.correcaoManual, resultado.comentarios, 2);

            addSection('FRASES (12 pts)', {
                frase1: '1. Beleza', frase2: '2. Castigo', frase3: '3. Conector'
            }, resultado.respostas?.frases, resultado.correcaoManual, resultado.comentarios, 4);

            addSection('CONOTATIVOS (5 pts)', {
                conot1: '1. Coracao pedra', conot2: '2. Perdeu-se', conot3: '3. Aguas cristalinas'
            }, resultado.respostas?.conotativos, resultado.correcaoManual, resultado.comentarios, 2);

            if (y > 260) { doc.addPage(); y = 20; }
            y += 5;
            doc.setFontSize(10);
            doc.setTextColor(31, 78, 120);
            doc.text('AUTOMATICO (25 pts)', m, y);
            y += 6;
            doc.setFontSize(9);
            doc.setTextColor(50);
            doc.text('Graus: ' + (resultado.pontuacoes?.graus || 0) + '/15 | Conectores: ' + (resultado.pontuacoes?.conectores || 0) + '/10', m, y);

            if (resultado.comentarios?.geral) {
                y += 10;
                doc.setFontSize(10);
                doc.setTextColor(31, 78, 120);
                doc.text('COMENTARIO DO PROFESSOR:', m, y);
                y += 6;
                doc.setFontSize(9);
                doc.setTextColor(50);
                const comLines = doc.splitTextToSize(resultado.comentarios.geral, 175);
                doc.text(comLines, m, y);
            }

            doc.save('Teste_' + resultado.aluno.nome.replace(/\s+/g, '_') + '.pdf');
        }
    </script>
</body>
</html>
